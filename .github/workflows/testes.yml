name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Trilha-ads e Trilha-LP, para o teste de contrato
        run: |
          git clone --depth 1 https://github.com/davi-barbosap/Trilha-ads ../Trilha-ads
          git clone --depth 1 https://github.com/davi-barbosap/Trilha-LP ../Trilha-LP
          pip install -e ../Trilha-ads -e ../Trilha-LP
      - run: python -m unittest discover -s tests -v
      - name: O teste de contrato não pode ter sido pulado
        run: python -c "import trilha.core.oferta, trilha_lp.esquema"
      - run: python -m trilha_briefing validar clientes/_exemplo
      - run: python -m trilha_briefing lacunas clientes/_exemplo
      - run: python -m trilha_briefing revisar clientes/_exemplo
      - run: python -m trilha_briefing plano clientes/_exemplo
      - run: python -m trilha_briefing exportar clientes/_exemplo --para trilha
      - run: python -m trilha_briefing exportar clientes/_exemplo --para lp --oferta conversacao-adultos
      - run: python -m trilha_briefing exportar clientes/_exemplo --para copy
      - run: python -m trilha_briefing apresentar clientes/_exemplo
      - name: O pacote instalado leva as regras padrão e os modelos
        run: |
          pip install --no-deps --target /tmp/instalado .
          cd /tmp && PYTHONPATH=/tmp/instalado python -c "import trilha_briefing.campanhas as m, trilha_briefing; from pathlib import Path; assert m.ARQUIVO_PADRAO.exists(); assert (Path(trilha_briefing.__file__).parent / 'modelo' / 'estrategia.yaml').exists(); m.regras_do_plano()"
