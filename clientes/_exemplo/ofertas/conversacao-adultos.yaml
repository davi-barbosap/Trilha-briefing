# Oferta principal. Big idea, promessa e antes/depois alimentam anúncios e a landing page.
id: conversacao-adultos
nome: Inglês para falar no trabalho
tipo: curso
degrau: principal
personas: [profissional-travado]
problema: "Adulto que entende inglês, mas trava para falar em reunião e entrevista"

big_idea:
  oportunidade: "Vagas de nível médio pedindo inglês para reuniões, não só leitura"
  inimigo: "Aula em que o professor fala e o aluno só escuta"
  mecanismo_unico: "Turma de até 6 em que você fala a maior parte da aula, treinando as situações do seu trabalho"

promessa:
