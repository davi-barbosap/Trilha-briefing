# O que o cliente diz. Ele responde o questionário (python -m trilha_briefing questionario)
# e o assessor transcreve e completa no kickoff. Exemplo preenchido: clientes/_exemplo/
cliente:
  id: ID_DO_CLIENTE               # igual ao nome da pasta
  nome: PREENCHER
  segmento: PREENCHER             # texto livre: odontologia, escola de idiomas, software B2B…
  playbook: padrao                # playbooks/<playbook>/ no Trilha
  site: ""
  redes: []
  whatsapp: ""                    # 55 + DDD + número, só dígitos
  tempo_mercado: ""

area:
  alcance: local                  # local | regional | nacional | online
  cidades: []
  raio_km: null
  observacoes: ""

negocio:
  o_que_vende: PREENCHER
  modelo_receita: venda_direta    # venda_direta | comissao | recorrencia
  tipo_compra: misto              # necessidade (puxa busca) | desejo (puxa descoberta) | misto
  como_vende_hoje: []
  ciclo_venda_dias: null
  contatos_mes: null              # contatos novos num mês normal, hoje (todos os canais)
  vendas_mes: null                # vendas ou clientes novos num mês normal, hoje
  time_comercial: ""
  crm: ""
  marketplaces: []                # onde a categoria já é comprada (iFood, Mercado Livre, Doctoralia…)

capacidade:                       # verba que gera mais do que isso queima lead
  leads_dia: null                 # contatos novos por dia que o time atende bem
  clientes_novos_mes: null        # clientes novos por mês que a operação entrega
  observacoes: ""

resultado_desejado:
  em_12_meses: PREENCHER          # o que precisa ser verdade daqui a 12 meses
  conhecido_por: ""
  sucesso_significa: ""

historico:
  funcionou: []                   # texto solto ou { texto, fonte, status, evidencia }
  nao_funcionou: []
  ja_investiu_em_midia: ""

restricoes:
  verba_mensal_max: null
  prazos: []
  regras_legais: []               # conselho profissional, publicidade regulada, LGPD
  nao_pode: []

stakeholders: []                  # { nome, papel, influencia: alta|media|baixa, interesse: alta|media|baixa, espera }
aprovacao:                        # quem aprova anúncio e texto do lado do cliente
  responsavel: ""
  prazo_horas: null
  substituto: ""

acessos:                          # ok | pendente | nao_tem (precisa criar) | nao_sei
  meta_business: nao_sei
  conta_anuncios_meta: nao_sei
  pixel_meta: nao_sei
  google_ads: nao_sei
  tag_google: nao_sei
  gtm: nao_sei
  ga4: nao_sei
  crm: nao_sei
  dominio: nao_sei

ativos:
  logo_editavel: nao_sei
  manual_marca: nao_sei
  fotos_reais: nao_sei
  videos_reais: nao_sei
  politica_privacidade: nao_sei
  lista_clientes_autorizada: nao_sei

preenchido_por: [assessor]        # acrescente cliente quando ele responder o questionário
data: null
