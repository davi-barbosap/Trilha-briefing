roteiro_escuta:
- Me conta como era a situação antes de você procurar a empresa. O que estava acontecendo?
- O que fez você decidir resolver isso naquele momento, e não antes?
- Antes de escolher, o que mais você considerou ou tentou? Por que não seguiu com isso?
- Onde você procurou informação, e em quem confiou para decidir?
- O que quase fez você desistir ou adiar?
- Qual era a sua maior preocupação antes de fechar?
- Por que escolheu esta empresa e não outra?
- O que mudou depois? Pode me dar um exemplo ou um número?
- Teve alguma coisa que te surpreendeu, para o bem ou para o mal?
- Se fosse explicar para um amigo o que eles fazem, o que você diria?
- Para quem você não recomendaria?
- Posso usar alguma frase sua, sem o seu nome, na comunicação da empresa?
sinais_de_alerta:
- 'Não sabe a margem nem quantos contatos viram venda: a economia fica toda estimada.'
- 'A primeira resposta leva mais de 2 horas, ou só sai no dia seguinte: o problema é o atendimento, não a mídia.'
- 'Ninguém tenta falar de novo com quem parou de responder: contato pago que fica no “visualizado” é verba perdida.'
- 'Ninguém registra por que o contato não comprou: não dá para saber se o gargalo é o lead, o atendimento ou o comercial.'
- '“Nosso diferencial é a qualidade” ou “o atendimento”: ainda não há posicionamento.'
- 'Não autoriza nenhuma escuta: as personas serão opinião da empresa.'
- 'Vendas fracas fora da internet (indicação, loja, visitas): o digital vai expor o problema mais rápido e mais caro.'
- 'Reputação com reclamações recorrentes sem resposta: a mídia amplifica o problema.'
- 'A capacidade de atendimento é menor do que os contatos que a verba traz: contato sem resposta é verba perdida.'
- 'A verba de teste não paga o volume mínimo dos testes: o teste vai terminar inconclusivo.'
- 'Espera venda em 30 dias com um ciclo de venda de meses: a expectativa precisa ser combinada antes.'
- 'Quer “muito contato barato” como meta: custo por contato baixo com contato que não compra é prejuízo disfarçado.'
- 'Ticket alto vendido só para quem nunca ouviu falar da empresa, sem porta de entrada nem prova forte: alto padrão raramente
  converte em tráfego frio.'
- 'Quem aprova anúncios leva mais de 2 dias ou não tem substituto: campanha parada e criativo vencido.'
- 'Promessa de resultado garantido em área regulada (saúde, advocacia, finanças): risco legal antes de risco de mídia.'
- 'Nenhuma prova utilizável (nem número com fonte nem depoimento autorizado): o anúncio vai prometer sem sustentar.'
