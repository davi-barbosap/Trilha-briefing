- id: substituto_aprovacao
  momento: cliente
  bloco: regras
  pergunta: Quem aprova quando essa pessoa não está?
  tipo: texto_curto
  campo: briefing.aprovacao.substituto
- id: stakeholders
  momento: reuniao
  bloco: regras
  pergunta: 'Quem participa das decisões de marketing? Para cada pessoa: função, quanto influencia, quanto se interessa e
    o que espera do projeto.'
  ajuda: Inclua quem pode mudar uma decisão depois (sócio, diretor comercial, gerente). Pessoa de alto impacto e pouca proximidade
    é risco para o projeto.
  campo: briefing.stakeholders
- id: requisitos
  momento: reuniao
